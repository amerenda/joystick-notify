<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Set admin password — joystick-notify</title>
  <style>
    body { margin: 0; background: #14161a; color: #e7e9ee; font: 15px/1.5 -apple-system, "Segoe UI", Roboto, sans-serif;
           display: flex; align-items: center; justify-content: center; min-height: 100vh; }
    .card { background: #1d2026; border: 1px solid #2b2f38; border-radius: 10px; padding: 28px 30px; width: 360px; }
    h1 { font-size: 18px; margin: 0 0 6px; }
    p.hint { color: #9aa1ad; font-size: 13px; margin: 0 0 18px; }
    label { display: block; font-size: 13px; color: #9aa1ad; margin: 14px 0 4px; }
    input { width: 100%; padding: 9px 10px; background: #10131a; border: 1px solid #2b2f38; border-radius: 6px; color: #e7e9ee; font-size: 14px; }
    button { width: 100%; margin-top: 20px; background: #5b8def; color: white; border: none; border-radius: 6px; padding: 10px; font-size: 14px; cursor: pointer; }
    .error { color: #e05c5c; font-size: 13px; margin-top: 12px; }
  </style>
</head>
<body>
  <form class="card" method="post" action="/setup-password">
    <h1>Set an admin password</h1>
    <p class="hint">First run: nothing else in joystick-notify is reachable
    until a password is set. This protects the setup wizard whether it
    stays on localhost or is later exposed on your LAN.</p>
    <label for="password">Password</label>
    <input id="password" name="password" type="password" minlength="8" required autofocus>
    <label for="confirm">Confirm password</label>
    <input id="confirm" name="confirm" type="password" minlength="8" required>
    {% if error %}<div class="error">{{ error }}</div>{% endif %}
    <button type="submit">Set password &amp; continue</button>
  </form>
</body>
</html>
